# /etc/nginx/sites-available/irlos.live
# TLS via certbot: certbot --nginx -d irlos.live -d www.irlos.live
# The app listens on 8788, not 8787. momweb.service already holds 8787 on this box.

server {
    listen 80;
    listen [::]:80;
    server_name irlos.live www.irlos.live;
    return 301 https://irlos.live$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name irlos.live;

    ssl_certificate /etc/letsencrypt/live/irlos.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/irlos.live/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    # keep in sync with the helmet directives in server/index.js
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-src https://js.stripe.com https://checkout.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self' https://checkout.stripe.com" always;

    root /opt/irlos-web/public;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    # brotli needs the ngx_brotli module. Uncomment if installed.
    # brotli on;
    # brotli_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # three.js and other vendored files never change without a rename
    location /vendor/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location ~* \.(css|js|jpg|jpeg|png|svg|webp|ico)$ {
        expires 7d;
        try_files $uri =404;
    }

    # hero footage. Byte ranges must work or Safari refuses to play the file.
    location ~* \.(mp4|webm|m4v)$ {
        # add_header only, not expires: the two together emit Cache-Control twice
        add_header Cache-Control "public, max-age=2592000";
        gzip off;
        try_files $uri =404;
    }

    location / {
        # Every page is a directory with an index.html, so the old .html URLs
        # 301 to the new form for bookmarks and anything already indexed.
        # These test $request_uri, the client's original request, on purpose:
        # serving /page/ makes nginx redirect internally to /page/index.html,
        # and matching that on a location or $uri turns it into a 301 loop.
        if ($request_uri ~ "^/(.*)index\.html($|\?)") { return 301 /$1$is_args$args; }
        if ($request_uri ~ "^/([^?]+)\.html($|\?)")   { return 301 /$1/$is_args$args; }

        try_files $uri $uri/ =404;
    }

    # the error page URI carries no .html, so it cannot hit the 301 above
    error_page 404 /404/;
}

# www over TLS. Without this, https://www.irlos.live falls through to the
# default server and shows a certificate name mismatch.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.irlos.live;

    ssl_certificate /etc/letsencrypt/live/irlos.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/irlos.live/privkey.pem;

    return 301 https://irlos.live$request_uri;
}
